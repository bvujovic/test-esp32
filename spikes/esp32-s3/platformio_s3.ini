[env:esp32-s3-supermini-env]
; Use the standard Espressif 32 platform
platform = espressif32
; Specify a similar development board as a base (DevKitC-1 is common)
board = esp32-s3-devkitc-1
; Use the Arduino framework
framework = arduino
; Set the serial monitor speed
monitor_speed = 115200

; --- Custom settings for the Supermini board ---

; Enable PSRAM as most supermini boards have it (check your specific board specs)
board_build.f_psram = enabled
; Set the memory type to QIO QSPI for flash and PSRAM operations
board_build.arduino.memory_type = qio_qspi

; Enable USB CDC on boot to use the native USB port for Serial communication and uploading
; This removes the need to press the BOOT button for every upload
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    ; If your board has an RGB LED on pin 48 (common on some variants), uncomment the next line:
    ; -DLED_BUILTIN=48 

; Ensure the upload protocol uses the native USB port
; upload_protocol = esp32s3-builtin
lib_deps = ivanseidel/LinkedList@0.0.0-alpha+sha.dac3874d28
